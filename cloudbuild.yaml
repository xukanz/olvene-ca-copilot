# gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=us-central1
substitutions:
  _REGION: us-central1
  _REPO: olvene
  _SA: huashu-sa
  _LLM_LOCATION: global          # Gemini 3 preview models are served only on the global endpoint
  _WEB_SERVICE: olvene-copilot   # public demo URL: https://olvene-copilot-<PROJECT_NUMBER>.<REGION>.run.app
  _GEN_MODEL: gemini-3.1-pro-preview
  _FAST_MODEL: gemini-3-flash-preview
  _AUTH_SECRET: olvene-web-auth  # Secret Manager secret holding Streamlit's [auth] secrets.toml (Google OIDC)
  _USER_DAILY_LIMIT: "20"        # LLM actions per Google account per day (Asia/Shanghai)
  _GLOBAL_DAILY_LIMIT: "200"     # LLM actions per day across all users
  _RESULTS_BUCKET: ${PROJECT_ID}-olvene-eval
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/copilot:${BUILD_ID}
options:
  dynamicSubstitutions: true
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/copilot:${BUILD_ID}", .]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/copilot:${BUILD_ID}"]
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, deploy, huashu-api, --region, "${_REGION}",
           --image, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/copilot:${BUILD_ID}",
           --service-account, "${_SA}@${PROJECT_ID}.iam.gserviceaccount.com",
           --set-env-vars, "ROLE=api,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_LLM_LOCATION},GEN_MODEL=${_GEN_MODEL},FAST_MODEL=${_FAST_MODEL},JUDGE_MODEL=${_FAST_MODEL}",
           --memory, 1Gi, --timeout, "180", --no-allow-unauthenticated]
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe huashu-api --region ${_REGION} --format 'value(status.url)')
        gcloud run services add-iam-policy-binding huashu-api --region ${_REGION} \
          --member serviceAccount:${_SA}@${PROJECT_ID}.iam.gserviceaccount.com --role roles/run.invoker
        gcloud run deploy ${_WEB_SERVICE} --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/copilot:${BUILD_ID} \
          --service-account ${_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars ROLE=web,API_URL=$$API_URL,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},REQUIRE_LOGIN=1,QUOTA_BACKEND=firestore,USER_DAILY_LIMIT=${_USER_DAILY_LIMIT},GLOBAL_DAILY_LIMIT=${_GLOBAL_DAILY_LIMIT} \
          --set-secrets /app/.streamlit/secrets.toml=${_AUTH_SECRET}:latest \
          --max-instances 3 \
          --memory 1Gi --allow-unauthenticated
  - id: deploy-eval-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, jobs, deploy, huashu-eval, --region, "${_REGION}",
           --image, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/copilot:${BUILD_ID}",
           --service-account, "${_SA}@${PROJECT_ID}.iam.gserviceaccount.com",
           --set-env-vars, "ROLE=eval,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_LLM_LOCATION},GEN_MODEL=${_GEN_MODEL},FAST_MODEL=${_FAST_MODEL},JUDGE_MODEL=${_FAST_MODEL},RESULTS_DIR=/results",
           --add-volume, "name=results,type=cloud-storage,bucket=${_RESULTS_BUCKET}",
           --add-volume-mount, "volume=results,mount-path=/results",
           --task-timeout, "3600", --memory, 2Gi, --max-retries, "0"]
