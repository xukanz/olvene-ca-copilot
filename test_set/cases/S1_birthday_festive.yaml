# S1 · 生日与节日问候（8 个用例）
# 所有人物均为虚构。history 中 from: ca = 客户顾问，from: client = 客户。

- id: S1-01
  scenario: birthday_festive
  occasion: 生日
  today: 2026-11-12
  ca: {name: 沈悦, boutique: SH}
  client:
    name: 周婉清
    address_as: 周女士
    gender: 女
    city: 上海
    stage: 熟悉
    purchases:
      - {product: P05, color: 湖蓝, date: 2025-04-18}
      - {product: P04, color: 焦糖棕, date: 2025-10-02}
    preferences: 偏爱蓝色与大地色，风格简洁
    important_dates: {生日: 11-12}
    notes:
      - 喜欢园艺，今年春天说想把院子里的月季扩种一片
      - 养了一只柯基，叫"豆包"
    comm_style: 喜欢简短，偶尔用表情
  history:
    - {from: client, time: "2026-10-15 19:20", text: "沈小姐，那条湖蓝丝巾不小心沾了点护手霜，要紧吗？"}
    - {from: ca, time: "2026-10-15 19:32", text: "周女士别担心，护手霜是油性的，先别用水擦。方便的话这周带到店里，我们帮您送去做专业清洁。"}
    - {from: client, time: "2026-10-15 19:35", text: "好的，周六过去"}
    - {from: ca, time: "2026-10-29 16:05", text: "周女士，丝巾清洁好了，颜色和手感都恢复了，您路过随时来取。"}
    - {from: client, time: "2026-10-29 16:40", text: "太好了，谢谢你"}
  product_ids: []
  event_ids: []
  focus: 生日问候中自然使用客户生活细节（园艺、柯基），不推销
  must_not: [推销产品, 提及年龄]

