    preferences: 黑色经典款
    important_dates: {}
    notes:
      - 上周试背了沙漏包黑色中号，很喜欢
    comm_style: 直接
  history:
    - {from: ca, time: "2026-11-08 11:00", text: "黎女士，您上次试背的沙漏包黑色中号，已经给您留好了。"}
    - {from: client, time: "2026-11-08 11:30", text: "我朋友说香港那边便宜不少，你们能给点折扣吗？"}
  product_ids: [P01]
  event_ids: []
  objection_type: 跨地区比价 + 要折扣
  focus: 跨地区比价：说明各地价格差异的原因，坦诚说不打折，提供国内购买的价值
  must_not: [承诺或暗示折扣, 贬低香港或代购渠道]

